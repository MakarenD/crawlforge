[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "crawlforge"
dynamic = ["version"]
description = "Local HTTP-first web-context engine with BM25 retrieval and MCP."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "CrawlForge contributors" }]
keywords = ["asyncio", "crawler", "web", "web-crawling"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP",
  "Typing :: Typed",
]
dependencies = [
  "aiofiles>=24.1",
  "aiohttp>=3.11",
  "aiosqlite>=0.22.1",
  "beautifulsoup4>=4.12",
  "lxml>=5.3",
]

[project.optional-dependencies]
mcp = [
  "mcp>=2.0.0,<3.0.0",
  "cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
dev = [
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.9",
  "types-aiofiles>=24.1.0.20250822",
]

[project.scripts]
crawlforge = "crawlforge.cli:main"
crawlforge-mcp = "crawlforge.mcp.cli:main"

[tool.hatch.version]
path = "src/crawlforge/__init__.py"

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "strict"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
files = ["src"]
mypy_path = "src"
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
