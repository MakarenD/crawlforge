name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Install project
        run: uv pip install --system -e ".[dev,mcp]"
      - name: Check dependencies
        run: uv pip check --system
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Check types
        run: mypy src
      - name: Check CLI
        run: python -m crawlforge --help
      - name: Build package
        run: uv build

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Install project
        run: uv pip install --system -e ".[dev,mcp]"
      - name: Run tests
        run: python -m pytest

  semantic-extra:
    name: Semantic extra (Python 3.12, offline)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Install semantic extra
        run: uv pip install --system -e ".[dev,semantic]"
      - name: Import semantic provider
        run: python -c "from crawlforge.semantic_provider import SentenceTransformerEmbeddingProvider"
      - name: Run deterministic semantic tests
        run: >-
          python -m pytest
          tests/test_semantic_models.py
          tests/test_semantic_provider.py
          tests/test_semantic_engine.py
          tests/test_hybrid_fusion.py
          tests/test_hybrid_retriever.py
          tests/test_evaluation_hybrid_strategy.py
          tests/test_evaluation_comparison.py
          tests/test_evaluation_multi_comparison.py
          tests/test_evaluation_cli.py
